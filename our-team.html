  <body class="teams-page teams-page--light-hero overflow-x-hidden bg-white font-sans text-ecoprism-text">
    <div id="header-container" data-header-container data-header-variant="dark"></div>

    <main class="min-w-0" x-data="teamsPage()">
      <!-- Hero -->
      <section class="teams-hero relative overflow-hidden pt-24 sm:pt-28 lg:pt-32" style="margin-top: -4.5rem">
        <div class="container relative mx-auto max-w-[1280px] px-4 pb-16 sm:px-6 sm:pb-20 lg:px-12 lg:pb-24">
          <div class="js-reveal max-w-2xl">
            <h1 class="font-poppins text-3xl font-bold leading-[1.5] text-[#343f52] sm:text-4xl lg:text-[2.75rem] xl:text-5xl">
              The people behind<br />
              <span class="text-ecoprism-primary">ecoPRISM</span>
            </h1>
            <p class="mt-6 max-w-xl text-base leading-relaxed text-ecoprism-text sm:text-lg">A team of sustainability experts, technologists, and designers united by the belief that better data leads to better decisions.</p>
          </div>
        </div>
      </section>

      <!-- Leadership -->
      <section class="teams-leadership teams-section-pad">
        <div class="container mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-12">
          <div class="js-reveal mx-auto max-w-3xl text-center">
            <h2 class="teams-h2 teams-h2--center font-poppins">Our Leadership Team</h2>
          </div>
          <div class="js-reveal js-reveal-delay-1 teams-leadership-grid grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
            <template x-for="(leader, index) in leadership" :key="leader.name">
              <article class="teams-leader-card flex flex-col">
                <div class="teams-leader-photo">
                  <img :src="leader.image" :alt="leader.name" width="400" height="320" loading="lazy" />
                </div>
                <div class="teams-leader-meta">
                  <div class="teams-leader-info">
                    <h3 class="teams-leader-name font-poppins" x-text="leader.name"></h3>
                    <p class="teams-leader-role font-poppins" x-text="leader.role"></p>
                  </div>
                  <a :href="leader.linkedin" class="teams-linkedin shrink-0" target="_blank" rel="noopener noreferrer" :aria-label="'LinkedIn profile of ' + leader.name">
                    <span class="teams-linkedin-icon" aria-hidden="true">
                      <i class="fa-brands fa-linkedin-in"></i>
                    </span>
                  </a>
                </div>
                <p class="teams-leader-bio" x-text="leader.bio"></p>
              </article>
            </template>
          </div>
        </div>
      </section>

      <!-- Team grid -->
      <section class="teams-team-section teams-section-pad">
        <div class="container mx-auto max-w-[1280px] px-4 sm:px-6 lg:px-12">
          <div class="js-reveal flex flex-col gap-2">
            <span class="teams-badge w-fit font-poppins">The Team</span>
            <h2 class="teams-h2 font-poppins mt-2 max-w-2xl">
              Experts Across Sustainability,<br class="hidden sm:block" />
              Technology &amp; Design
            </h2>
          </div>

          <div class="js-reveal js-reveal-delay-1 teams-grid-wrap mt-12 lg:mt-16">
            <div class="teams-grid">
              <template x-for="member in membersTopRow()" :key="'top-' + member.name">
                <article class="teams-member-card">
                  <div class="teams-member-photo">
                    <img x-show="hasPhoto(member)" :src="member.image" :alt="member.name" width="120" height="120" loading="lazy" />
                    <div x-show="!hasPhoto(member)" class="teams-member-initials font-poppins" x-text="member.initials" :aria-label="member.name + ' photo placeholder'"></div>
                  </div>
                  <div class="teams-member-body">
                    <h3 class="teams-h4 font-poppins min-w-0">
                      <a x-show="hasLinkedin(member)" :href="member.linkedin" class="teams-name-link" target="_blank" rel="noopener noreferrer" x-text="member.name"></a>
                      <span x-show="!hasLinkedin(member)" x-text="member.name"></span>
                    </h3>
                    <p class="teams-member-role font-poppins" x-text="member.role"></p>
                  </div>
                </article>
              </template>
            </div>

            <div class="teams-grid">
              <template x-for="member in [memberVasini()]" :key="member.name">
                <article class="teams-member-card">
                  <div class="teams-member-photo">
                    <img x-show="hasPhoto(member)" :src="member.image" :alt="member.name" width="120" height="120" loading="lazy" />
                    <div x-show="!hasPhoto(member)" class="teams-member-initials font-poppins" x-text="member.initials" :aria-label="member.name + ' photo placeholder'"></div>
                  </div>
                  <div class="teams-member-body">
                    <h3 class="teams-h4 font-poppins min-w-0">
                      <a x-show="hasLinkedin(member)" :href="member.linkedin" class="teams-name-link" target="_blank" rel="noopener noreferrer" x-text="member.name"></a>
                      <span x-show="!hasLinkedin(member)" x-text="member.name"></span>
                    </h3>
                    <p class="teams-member-role font-poppins" x-text="member.role"></p>
                  </div>
                </article>
              </template>

              <blockquote class="teams-quote-card">
                <p class="teams-quote-text font-poppins" x-text="teamQuote"></p>
              </blockquote>

              <template x-for="member in [memberPranjal()]" :key="member.name">
                <article class="teams-member-card">
                  <div class="teams-member-photo">
                    <img x-show="hasPhoto(member)" :src="member.image" :alt="member.name" width="120" height="120" loading="lazy" />
                    <div x-show="!hasPhoto(member)" class="teams-member-initials font-poppins" x-text="member.initials" :aria-label="member.name + ' photo placeholder'"></div>
                  </div>
                  <div class="teams-member-body">
                    <h3 class="teams-h4 font-poppins min-w-0">
                      <a x-show="hasLinkedin(member)" :href="member.linkedin" class="teams-name-link" target="_blank" rel="noopener noreferrer" x-text="member.name"></a>
                      <span x-show="!hasLinkedin(member)" x-text="member.name"></span>
                    </h3>
                    <p class="teams-member-role font-poppins" x-text="member.role"></p>
                  </div>
                </article>
              </template>
            </div>

            <div class="teams-grid">
              <template x-for="member in membersBottomRow()" :key="'bottom-' + member.name">
                <article class="teams-member-card">
                  <div class="teams-member-photo">
                    <img x-show="hasPhoto(member)" :src="member.image" :alt="member.name" width="120" height="120" loading="lazy" />
                    <div x-show="!hasPhoto(member)" class="teams-member-initials font-poppins" x-text="member.initials" :aria-label="member.name + ' photo placeholder'"></div>
                  </div>
                  <div class="teams-member-body">
                    <h3 class="teams-h4 font-poppins min-w-0">
                      <a x-show="hasLinkedin(member)" :href="member.linkedin" class="teams-name-link" target="_blank" rel="noopener noreferrer" x-text="member.name"></a>
                      <span x-show="!hasLinkedin(member)" x-text="member.name"></span>
                    </h3>
                    <p class="teams-member-role font-poppins" x-text="member.role"></p>
                  </div>
                </article>
              </template>
            </div>
          </div>
        </div>
      </section>
    </main>
